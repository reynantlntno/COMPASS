[project]
name = "compass-backend"
version = "0.1.0"
description = "COMPASS backend foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography==50.0.1",
    "Django==6.1.1",
    "celery[redis]==5.6.3",
    "django-ninja==1.7.0",
    "django-storages[s3]==1.14.6",
    "gunicorn==26.1.0",
    "Pillow==12.3.0",
    "psycopg[binary]>=3.2,<4",
    "pyotp==2.10.0",
    "redis>=6,<9",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.12,<5",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
